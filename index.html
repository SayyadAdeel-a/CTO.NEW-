<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV/Resume Builder - Create Your Professional CV</title>
    <meta name="description" content="Create and download your professional CV in minutes. Free, easy-to-use resume builder.">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📄 CV/Resume Builder</h1>
            <p class="subtitle">Create your professional CV in minutes</p>
        </header>

        <div class="main-content">
            <div class="form-section">
                <h2>📝 Fill in Your Information</h2>
                
                <form id="cvForm">
                    <div class="form-group">
                        <label for="fullName">Full Name *</label>
                        <input type="text" id="fullName" required placeholder="John Doe">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">Email *</label>
                            <input type="email" id="email" required placeholder="john@example.com">
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number *</label>
                            <input type="tel" id="phone" required placeholder="+1 234 567 8900">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="summary">Professional Summary *</label>
                        <textarea id="summary" rows="4" required placeholder="Brief overview of your professional background and key strengths..."></textarea>
                    </div>

                    <div class="section-divider">
                        <h3>🎓 Education</h3>
                    </div>

                    <div id="educationContainer">
                        <div class="education-entry">
                            <div class="form-group">
                                <label for="school_0">School/University</label>
                                <input type="text" id="school_0" placeholder="University Name">
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="degree_0">Degree</label>
                                    <input type="text" id="degree_0" placeholder="Bachelor of Science">
                                </div>
                                <div class="form-group">
                                    <label for="eduYears_0">Years</label>
                                    <input type="text" id="eduYears_0" placeholder="2015-2019">
                                </div>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="btn-secondary" onclick="addEducation()">+ Add Education</button>

                    <div class="section-divider">
                        <h3>💼 Work Experience</h3>
                    </div>

                    <div id="experienceContainer">
                        <div class="experience-entry">
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="company_0">Company</label>
                                    <input type="text" id="company_0" placeholder="Company Name">
                                </div>
                                <div class="form-group">
                                    <label for="role_0">Role</label>
                                    <input type="text" id="role_0" placeholder="Software Engineer">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="expYears_0">Years</label>
                                <input type="text" id="expYears_0" placeholder="2019-Present">
                            </div>
                            <div class="form-group">
                                <label for="description_0">Description</label>
                                <textarea id="description_0" rows="3" placeholder="Key responsibilities and achievements..."></textarea>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="btn-secondary" onclick="addExperience()">+ Add Experience</button>

                    <div class="section-divider">
                        <h3>🔧 Skills</h3>
                    </div>

                    <div class="form-group">
                        <label for="skills">Skills (comma-separated) *</label>
                        <input type="text" id="skills" required placeholder="JavaScript, Python, Project Management, Communication">
                    </div>

                    <div class="section-divider">
                        <h3>🔗 Links (Optional)</h3>
                    </div>

                    <div class="form-group">
                        <label for="linkedin">LinkedIn</label>
                        <input type="url" id="linkedin" placeholder="https://linkedin.com/in/yourprofile">
                    </div>

                    <div class="form-group">
                        <label for="portfolio">Portfolio</label>
                        <input type="url" id="portfolio" placeholder="https://yourportfolio.com">
                    </div>

                    <div class="form-group">
                        <label for="github">GitHub</label>
                        <input type="url" id="github" placeholder="https://github.com/yourusername">
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn-primary" onclick="generatePreview()">👁️ Preview CV</button>
                        <button type="button" class="btn-primary" onclick="downloadPDF()">⬇️ Download PDF</button>
                    </div>
                </form>
            </div>

            <div class="preview-section">
                <h2>👁️ CV Preview</h2>
                <div id="cvPreview" class="cv-preview">
                    <div class="preview-placeholder">
                        <p>Fill in the form and click "Preview CV" to see your resume</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>Built with ❤️ | <a href="no-code-guides/GLIDE.md">Glide Guide</a> | <a href="no-code-guides/BUBBLE.md">Bubble Guide</a> | <a href="no-code-guides/SOFTR.md">Softr Guide</a></p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pdf-generator.js"></script>
</body>
</html>
